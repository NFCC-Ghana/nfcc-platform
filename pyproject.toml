[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

# flake8 config lives in .flake8 (flake8 doesn't read pyproject.toml) and
# pytest config in pytest.ini (pytest ignores this file's section when a
# pytest.ini exists) - sections for both used to sit here, silently unused.
