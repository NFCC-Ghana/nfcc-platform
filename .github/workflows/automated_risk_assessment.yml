name: Automated Flood Risk Assessment

on:
  schedule:
    # Every 3 hours - frequent enough to catch a developing flood event
    # without spamming the review queue; adjust if the team wants tighter
    # monitoring during rainy season.
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Least-privilege default (CodeQL flagged its absence): this workflow
# calls the live API to queue assessments for review, not the git repo -
# never pushes commits or opens PRs.
permissions:
  contents: read

jobs:
  automated-risk-assessment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run automated risk assessment
        env:
          NFCC_API_KEY: ${{ secrets.NFCC_API_KEY }}
        run: python scripts/automated_risk_assessment.py
