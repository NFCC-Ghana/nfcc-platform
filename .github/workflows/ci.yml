name: NFCC CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -k "not providers" --cov=src --cov-report=term-missing --cov-report=html:reports/coverage --cov-fail-under=0

      - name: Check imports
        run: |
          python -c "from src.api.main import app; print('API imports OK')"

      - name: API smoke test
        run: |
          uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/
          curl -f http://127.0.0.1:8000/districts
          curl -f -X POST http://127.0.0.1:8000/score \
            -H "Content-Type: application/json" \
            -d '{"location":"Accra Central","precipitation":95.5}'
          kill %1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8 and black
        run: python -m pip install --upgrade pip && pip install flake8 black

      # Uses the repo's existing .flake8 config (max-line-length=88, real
      # style noise like E501/F401/E402 already ignored there) - flags
      # real correctness issues (undefined names, syntax problems), not
      # cosmetic style. flake8 and black were already pinned in
      # requirements-dev.txt but neither was ever actually run in CI -
      # this had been silently unenforced since day one.
      - name: flake8 (src/)
        run: python -m flake8 src/

      # black was pinned alongside flake8 above with the same claim of
      # being "in use" - true of neither until this pass. The codebase
      # was reformatted once (46 files, purely cosmetic - black changes
      # only whitespace/line-wrapping, never semantics, confirmed via the
      # full test suite passing unchanged before and after) to bring this
      # gate to a clean baseline rather than launching it already red.
      - name: black --check (src/)
        run: python -m black --check src/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install scanners
        run: python -m pip install --upgrade pip && pip install bandit pip-audit

      # Medium+ severity only (-ll): every low-severity finding in this
      # codebase today is B311 (use of `random`, not a crypto module) in
      # already-disclosed simulation/fallback code - never for anything
      # security-sensitive (no tokens, sessions, or passwords use it).
      # Flagging those would just be noise a reviewer learns to ignore,
      # which defeats the point of a gate. Verified 0 medium/high
      # findings before adding this as a blocking step.
      - name: bandit SAST (src/)
        run: python -m bandit -r src/ -ll

      # Scans this project's actual pinned dependencies for known CVEs -
      # informational for now (continue-on-error), not blocking: a new
      # advisory can land against an already-deployed, otherwise-fine
      # pin at any time, and that shouldn't silently fail every
      # unrelated PR - a human should triage and decide whether to bump.
      - name: pip-audit (requirements.txt)
        continue-on-error: true
        run: python -m pip_audit -r requirements.txt
