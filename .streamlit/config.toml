[theme]
# Inherit from the light theme base
base = "light"

# Your primary accent color (keeps your orange theme)
primaryColor = "#ffaa00"

# White background (keeps your existing design)
backgroundColor = "#ffffff"

# Light gray for interactive elements
secondaryBackgroundColor = "#f0f2f6"

# 🔑 KEY FIX: BLACK text - this makes all text visible!
textColor = "#000000"

# Font
font = "sans serif"
