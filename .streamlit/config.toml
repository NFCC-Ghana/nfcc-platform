[theme]
# Finelo-inspired dark theme: near-black page, bright lime-green accent.
# Kept in sync with hackathon/app/pages/dashboard.py's global CSS block
# and hackathon/app/modules/v4/visual_components.py's Theme class.
base = "dark"
primaryColor = "#8CD867"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#161616"
textColor = "#F5F5F5"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
port = 8501
address = "0.0.0.0"

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
