[pytest]
# Only tests/ - without this a bare `pytest` also collected manual scripts
# elsewhere in the repo, including ones that send real email/SMS at
# import time (now under scripts/manual/).
testpaths = tests
minversion = 7.0
markers =
    skip_ci: Skip tests that fail in CI environment
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
